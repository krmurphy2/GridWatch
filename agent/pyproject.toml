[project]
name = "gridwatch-agent"
version = "0.1.0"
description = "LangGraph router screenshot extraction agent for GridWatch"
requires-python = ">=3.11,<3.13"
dependencies = [
    "langgraph==1.2.9",
    "langchain-openai==1.3.4",
    "langchain-core==1.4.9",
    "pydantic==2.13.4",
    "langchain-qdrant>=1.1.0",
    "qdrant-client>=1.18.0",
    "langchain-text-splitters>=1.1.2",
    "rank-bm25>=0.2.2",
]

[tool.setuptools]
py-modules = ["router_extraction", "security_chat", "findings_summary", "llm", "rag"]
